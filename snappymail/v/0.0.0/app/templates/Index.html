<!DOCTYPE html>
<html data-design-default='{{BaseAppDesign}}'>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="google" content="notranslate">
	<meta name="robots" content="noindex,nofollow,noodp">
	<title></title>
	<link type="text/css" rel="stylesheet" href="{{BaseAppMainCssLink}}">
	<script nonce="">
		try {
			var appearance = localStorage.getItem("sm-appearance") || "system";
			var dark = appearance === "dark" || (appearance !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
			document.documentElement.dataset.appearance = appearance;
			if (dark) document.documentElement.classList.add("dark");
			document.documentElement.style.colorScheme = dark ? "dark" : "light";
		} catch (e) {}
		try {
			var design = localStorage.getItem("sm-design");
			if (design !== "mistral" && design !== "office") design = document.documentElement.dataset.designDefault;
			document.documentElement.dataset.design = design === "office" ? "office" : "mistral";
		} catch (e) {
			document.documentElement.dataset.design = "mistral";
		}
	</script>
	<link rel="manifest" href="{{BaseAppManifestLink}}">
	<link rel="icon" href="{{BaseFavIconSvg}}" type="image/svg+xml">
	{{BaseAppFaviconPngLinkTag}}
	{{BaseAppFaviconTouchLinkTag}}
</head>
<body data-admin='{{BaseAppAdmin}}' data-theme='{{BaseAppThemeName}}'>
	<div id="app">{{LoadingDescriptionEsc}}</div>
	<noscript>{{NO_SCRIPT_DESC}}</noscript>
	<script nonce="">var rl = window.rl || {};</script>
	<script nonce="">{{BaseLanguage}}</script>
	<script nonce="" type="module" src="{{BaseAppMainJsLink}}"></script>
</body>
</html>
