<div class="form-horizontal ai-settings">
	<div class="legend" data-i18n="AI_COPILOT/TAB_NAME"></div>

	<div class="control-group">
		<div class="controls">
			<div data-bind="component: {name: 'Checkbox', params: {label: 'AI_COPILOT/ENABLED', value: enabled}}"></div>
		</div>
	</div>

	<div class="control-group" data-bind="visible: enabled">
		<label class="control-label" data-i18n="AI_COPILOT/FEATURES"></label>
		<div class="controls" data-bind="foreach: features">
			<label class="ai-check"><input type="checkbox" data-bind="checked: value"> <span data-bind="text: label"></span></label>
		</div>
	</div>

	<div class="control-group" data-bind="visible: enabled">
		<label class="control-label" data-i18n="AI_COPILOT/TONE_DEFAULT"></label>
		<div class="controls">
			<select data-bind="options: tones, optionsText: 'name', optionsValue: 'id', value: tone"></select>
		</div>
	</div>

	<div class="control-group" data-bind="visible: enabled">
		<label class="control-label" data-i18n="AI_COPILOT/LANGUAGE"></label>
		<div class="controls">
			<select data-bind="options: languages, optionsText: 'name', optionsValue: 'id', value: language"></select>
		</div>
	</div>

	<div class="control-group" data-bind="visible: enabled">
		<label class="control-label" data-i18n="AI_COPILOT/YOUR_NAME"></label>
		<div class="controls">
			<input type="text" maxlength="100" data-bind="textInput: name" data-i18n="[placeholder]AI_COPILOT/YOUR_NAME_PLACEHOLDER">
		</div>
	</div>

	<div class="control-group" data-bind="visible: enabled">
		<label class="control-label" data-i18n="AI_COPILOT/STYLE"></label>
		<div class="controls">
			<textarea rows="3" maxlength="500" data-bind="textInput: style" data-i18n="[placeholder]AI_COPILOT/STYLE_PLACEHOLDER"></textarea>
		</div>
	</div>

	<div class="control-group" data-bind="visible: enabled">
		<label class="control-label" data-i18n="AI_COPILOT/ADDRESSES"></label>
		<div class="controls">
			<input type="text" maxlength="500" data-bind="textInput: addresses" data-i18n="[placeholder]AI_COPILOT/ADDRESSES_PLACEHOLDER">
			<div class="ai-muted" data-i18n="AI_COPILOT/ADDRESSES_HINT"></div>
		</div>
	</div>

	<div class="control-group" data-bind="visible: enabled">
		<label class="control-label" data-i18n="AI_COPILOT/PROVIDERS"></label>
		<div class="controls">
			<table class="ai-provider-table" data-bind="foreach: providers">
				<tr><td data-bind="text: label"></td><td data-bind="text: value"></td></tr>
			</table>
			<div class="ai-muted" data-i18n="AI_COPILOT/PRIVACY_HINT"></div>
			<label class="ai-check"><input type="checkbox" data-bind="checked: noticeAck"> <span data-i18n="AI_COPILOT/NOTICE_ACK"></span></label>
		</div>
	</div>

	<div class="control-group">
		<div class="controls">
			<button type="button" class="btn" data-bind="click: save, enable: !saving()" data-i18n="AI_COPILOT/SAVE"></button>
			<span class="ai-muted" data-bind="text: status"></span>
		</div>
	</div>
</div>
