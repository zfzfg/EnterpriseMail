# cargo-deny 0.20.2 policy. Keep this list and all exceptions reviewable.
[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"

[licenses]
confidence-threshold = 0.8
include-dev = true
include-build = true
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

# The crate is AGPL-3.0-or-later but unpublished; third-party crates still
# require an explicit license allowlist entry.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unused-allowed-source = "deny"
