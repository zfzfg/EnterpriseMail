name: verify

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix ui --no-audit --no-fund
      - name: Run frontend unit tests
        run: node --test ui/test/*.test.mjs
      - name: Typecheck frontend
        run: npm run typecheck --prefix ui
      - name: Build committed frontend artifacts
        run: npm run build --prefix ui
      - name: Check bundle budgets
        run: npm run bundle:check --prefix ui
      - name: Reject generated artifact drift
        run: |
          git diff --exit-code -- ui/src/icons.ts snappymail/v/0.0.0/static
          untracked="$(git ls-files --others --exclude-standard -- ui/src/icons.ts snappymail/v/0.0.0/static)"
          if [ -n "$untracked" ]; then
            printf 'Untracked generated artifacts:\n%s\n' "$untracked" >&2
            exit 1
          fi
      - name: Upload bundle reports
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: frontend-bundle-reports
          path: |
            build/local/bundle/
            build/local/esbuild/
          if-no-files-found: error
          retention-days: 14

  php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, fileinfo, iconv, intl, mbstring, openssl, sodium, xml, zip
          coverage: none
      - name: Set up Node.js for release version validation
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - name: Check PHP syntax and run offline tests
        run: bash scripts/ci/php.sh
      - name: Build and smoke-test release archives
        if: matrix.php == '8.5'
        run: bash scripts/ci/package.sh
      - name: Upload reviewed release archives
        if: matrix.php == '8.5' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: snappymail-release-archives
          path: build/dist/releases/webmail/
          if-no-files-found: error
          retention-days: 14

  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/snappy-ai-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Report locked Rust toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint locked Rust targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run locked Rust tests
        run: cargo test --locked
      - name: Verify Rust dependency supply chain
        id: supply_chain
        run: bash ../../scripts/ci/rust-supply-chain.sh
      - name: Record locked dependency metadata
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/local/release"
          cargo metadata --locked --format-version 1 > "${GITHUB_WORKSPACE}/build/local/release/rust-metadata.json"
      - name: Upload Rust build metadata
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rust-build-metadata
          path: build/local/release/rust-metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Rust supply-chain reports
        if: always() && steps.supply_chain.outcome != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rust-supply-chain-reports
          path: build/local/release/rust-supply-chain/
          if-no-files-found: warn
          retention-days: 30

  integration:
    needs: [frontend, php, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test PHP and Rust HTTP integration with isolated fixtures
        run: .docker/release/test/phase5/run.sh
