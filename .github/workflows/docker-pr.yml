name: docker-pr

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64 }
          - { arch: arm64, platform: linux/arm64 }
          - { arch: '386', platform: linux/386 }
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .docker/release/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          push: false
          load: true
          tags: snappymail:ci-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SnappyMail fork with TypeScript UI and optional AI streaming
            org.opencontainers.image.licenses=AGPLv3
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,scope=runtime-${{ matrix.arch }},mode=max
      - name: Test actual HTTP runtime
        run: .docker/release/test/test.sh snappymail:ci-${{ matrix.arch }}
      - name: Record image metadata
        run: |
          mkdir -p build/local/release
          docker image inspect snappymail:ci-${{ matrix.arch }} > build/local/release/image-${{ matrix.arch }}.json
          docker history --no-trunc snappymail:ci-${{ matrix.arch }} > build/local/release/image-${{ matrix.arch }}-history.txt
      - name: Upload architecture image metadata
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: image-metadata-${{ matrix.arch }}
          path: build/local/release/
          if-no-files-found: error
          retention-days: 14
