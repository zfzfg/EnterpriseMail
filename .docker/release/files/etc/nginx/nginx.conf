worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log off;
  error_log /dev/stderr error;

  sendfile on;
  keepalive_timeout 15;
  keepalive_disable msie6;
  keepalive_requests 100;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;

  fastcgi_temp_path /tmp/fastcgi 1 2;
  client_body_temp_path /tmp/client_body 1 2;
  proxy_temp_path /tmp/proxy 1 2;
  uwsgi_temp_path /tmp/uwsgi 1 2;
  scgi_temp_path /tmp/scgi 1 2;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_buffers 4 8k;
  gzip_proxied any;
  gzip_vary on;
  gzip_disable "msie6";
  gzip_types
    text/css
    text/javascript
    text/xml
    text/plain
    text/x-component
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/vnd.ms-fontobject
    font/truetype
    font/opentype
    image/svg+xml;

  server {
    listen 8888;
    listen [::]:8888;
    #listen [::]:8888 ipv6only=off;
    root /snappymail;
    index index.php;
    charset utf-8;

    client_max_body_size <UPLOAD_MAX_SIZE>;

    location ^~ /data {
      deny all;
    }

    location / {
      try_files $uri $uri/ index.php;
    }

    # Assets cache control
    # --------------------------------------
    location ~* \.(?:html|xml|json)$ {
      expires -1;
    }

    location ~* \.(?:css|js)$ {
      # gzip_vary alone omits Vary on 304 responses; cache variants explicitly.
      gzip_vary off;
      add_header Vary "Accept-Encoding" always;
      expires 7d;
      add_header Pragma public;
      add_header Cache-Control "public";
    }

    location ~* \.(?:gif|jpe?g|png|ico|otf|eot|svg|ttf|woff|woff2)$ {
      gzip_vary off;
      add_header Vary "Accept-Encoding" always;
      expires 30d;
      log_not_found off;
      add_header Pragma public;
      add_header Cache-Control "public";
    }

    # Public streaming boundary. Rust performs a private PHP prepare call before
    # acquiring provider permits; there is no automatic PHP replay after dispatch.
    location = /api/ai/stream {
      if ($request_method != POST) {
        return 405;
      }
      client_max_body_size 64k;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-SM-Token $http_x_sm_token;
      proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
      proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
      proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Snappy-Proxy-Key "";
      proxy_set_header X-Request-ID "";
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 2s;
      proxy_send_timeout 60s;
      proxy_read_timeout 305s;
      proxy_pass http://127.0.0.1:3001;
    }

    # The prepare action is reachable only on the separate loopback listener.
    location = /internal/ai/prepare {
      return 404;
    }

    # Minimal liveness/readiness probe: PHP-FPM responds without bootstrapping
    # SnappyMail, reading mail data, or contacting an AI provider.
    location = /healthz {
      access_log off;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /health.php;
      fastcgi_param HTTP_PROXY "";
      fastcgi_pass 127.0.0.1:9000;
    }

    # PHP Backend
    # --------------------------------------
    location ~* \.php$ {
      try_files $uri =404;
      include fastcgi_params;
      fastcgi_split_path_info ^(.+\.php)(/.*)$;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param PATH_INFO $fastcgi_path_info;
      fastcgi_param HTTP_PROXY "";
      fastcgi_index index.php;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_intercept_errors on;
      fastcgi_request_buffering off;
      # Trust only the direct socket peer, never an arbitrary client X-Real-IP.
      fastcgi_param REMOTE_ADDR $remote_addr;
    }

  }

  # Dedicated private transport for the prepare RPC. No public port or generic
  # PHP location can reach this listener; sensitive headers are never logged.
  server {
    listen 127.0.0.1:8081;
    server_name _;
    root /snappymail;
    access_log off;
    client_max_body_size 64k;

    location = /internal/ai/prepare {
      if ($request_method != POST) {
        return 405;
      }
      include fastcgi_params;
      fastcgi_param QUERY_STRING /AiPrepare/;
      fastcgi_param SCRIPT_FILENAME /snappymail/index.php;
      fastcgi_param REQUEST_URI /internal/ai/prepare;
      fastcgi_param DOCUMENT_URI /internal/ai/prepare;
      fastcgi_param SNAPPY_AI_PREPARE rust-ai-prepare-v1;
      fastcgi_param REMOTE_ADDR 127.0.0.1;
      fastcgi_param HTTP_COOKIE $http_cookie;
      fastcgi_param HTTP_X_SM_TOKEN $http_x_sm_token;
      fastcgi_param HTTP_SEC_FETCH_SITE $http_sec_fetch_site;
      fastcgi_param HTTP_SEC_FETCH_MODE $http_sec_fetch_mode;
      fastcgi_param HTTP_SEC_FETCH_DEST $http_sec_fetch_dest;
      fastcgi_param HTTP_ORIGIN $http_origin;
      fastcgi_param HTTP_X_SNAPPY_PROXY_KEY $http_x_snappy_proxy_key;
      fastcgi_param HTTP_X_REQUEST_ID $http_x_request_id;
      fastcgi_param HTTP_PROXY "";
      fastcgi_request_buffering off;
      fastcgi_intercept_errors off;
      fastcgi_connect_timeout 2s;
      fastcgi_send_timeout 35s;
      fastcgi_read_timeout 35s;
      fastcgi_pass 127.0.0.1:9000;
    }

    location / {
      return 404;
    }
  }

}
