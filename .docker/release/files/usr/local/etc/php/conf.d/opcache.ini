; OPcache is built into PHP 8.5; explicitly enable it for FPM here.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.save_comments=1

; Initial candidates only, not measured universal capacities.
; Under the complete production plugin set, inspect cached-script count,
; free/wasted memory, restarts, and cache misses; resize with headroom.
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
