; OPcache is built into PHP 8.5; explicitly enable it for FPM here.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=1
opcache.save_comments=1

; Release acceptance on PHP 8.5/linux/amd64 cached all 1,032 production core
; and plugin scripts in about 19.4 MiB, with zero wasted bytes, no additional
; warm-cache misses, and no restarts. Capacities retain over three times demand.
; Re-run .docker/release/test/runtime/run.sh when the shipped code set changes.
opcache.memory_consumption=64
opcache.max_accelerated_files=4000
