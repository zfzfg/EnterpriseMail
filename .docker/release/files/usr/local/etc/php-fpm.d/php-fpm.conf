[global]
daemonize = no
error_log = /dev/stderr
log_buffering = no

[default]
listen = 127.0.0.1:9000
clear_env = yes
; Only the PHP consumers below inherit container environment values.
; Rust receives its own complete SNAPPY_AI_PROXY_* configuration from Supervisor.
env[SNAPPY_AI_PROXY_ENABLED] = $SNAPPY_AI_PROXY_ENABLED
env[SNAPPY_AI_PROXY_SERVICE_CREDENTIAL] = $SNAPPY_AI_PROXY_SERVICE_CREDENTIAL
env[MISTRAL_API_KEY] = $MISTRAL_API_KEY
env[LLMSTER_API_KEY] = $LLMSTER_API_KEY
rlimit_core = 0
user = www-data
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 30
pm.process_idle_timeout = 10s
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
chdir = /
pm.status_path = /status
php_admin_value[log_errors] = On
php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[date.timezone] = UTC
php_admin_value[post_max_size] = <UPLOAD_MAX_SIZE>
php_admin_value[upload_max_filesize] = <UPLOAD_MAX_SIZE>
php_admin_value[memory_limit] = <MEMORY_LIMIT>
