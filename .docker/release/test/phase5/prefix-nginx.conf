worker_processes 1;
pid /tmp/phase5-prefix-nginx.pid;
worker_rlimit_core 0;

events {
  worker_connections 128;
}

http {
  access_log off;
  error_log /dev/stderr error;
  server_tokens off;
  client_body_temp_path /tmp/phase5-prefix-body;
  proxy_temp_path /tmp/phase5-prefix-proxy;

  server {
    listen 8888;
    server_name _;
    client_max_body_size 64k;

    location /mail/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-SM-Token $http_x_sm_token;
      proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
      proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
      proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
      proxy_set_header Origin $http_origin;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 305s;
      proxy_pass http://snappymail:8888/;
    }

    location / {
      return 404;
    }
  }
}
