# See: https://github.com/GoogleContainerTools/container-structure-test
# See: https://github.com/GoogleContainerTools/container-structure-test/issues/78
schemaVersion: 2.0.0
commandTests:
  - name: Integration test
    command: /bin/sh
    args:
      - -c
      - |
          set -eux
          DEBUG=true /entrypoint.sh > /tmp/test 2>&1 &
          sleep 5
          cat /tmp/test
          pidof supervisord
          pidof nginx
          pidof php-fpm
          ls -al /var/lib/snappymail/_data_/_default_/configs/application.ini
          ls -al /var/lib/snappymail/_data_/_default_/admin_password.txt
          nc -vz 127.0.0.1 8888
          nc -vz 127.0.0.1 9000
          nc -vz 127.0.0.1 8081
          test -z "`pidof snappy-ai-proxy || true`"
          test ! -e /etc/supervisor.d/snappy-ai-proxy.ini
          if [ "$(php -r 'echo PHP_INT_SIZE;')" = 4 ]; then
            test ! -e /usr/local/bin/snappy-ai-proxy
            if SNAPPY_AI_PROXY_ENABLED=true /entrypoint.sh > /tmp/rust-refusal 2>&1; then
              echo '386 image unexpectedly accepted Rust mode' >&2
              exit 1
            fi
          else
            test -x /usr/local/bin/snappy-ai-proxy
          fi
          wget -S -T 3 -O /dev/null http://127.0.0.1:8888
          wget -q -T 3 -O /tmp/health-response http://127.0.0.1:8888/healthz
          test ! -s /tmp/health-response
          php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);'
          su -s /bin/sh snappy-ai-proxy -c 'test ! -r /var/lib/snappymail/_data_/_default_/admin_password.txt'
          php -r 'exit(filter_var(ini_get("opcache.enable"), FILTER_VALIDATE_BOOL) ? 0 : 1);'
          php -r 'exit(filter_var(ini_get("opcache.enable_cli"), FILTER_VALIDATE_BOOL) ? 1 : 0);'
          php -r 'exit(filter_var(ini_get("opcache.validate_timestamps"), FILTER_VALIDATE_BOOL) ? 0 : 1);'
          php -r 'exit(filter_var(ini_get("opcache.save_comments"), FILTER_VALIDATE_BOOL) ? 0 : 1);'
          kill `pidof supervisord`
metadataTest:
  exposedPorts: ["8888"]
  volumes: ["/var/lib/snappymail"]
  entrypoint: []
  cmd: ["/entrypoint.sh"]
  workdir: /snappymail
  user: root
